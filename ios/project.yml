name: Kart
options:
  bundleIdPrefix: com.kart
  deploymentTarget:
    iOS: "26.0"
packages:
  KartCore:
    path: KartCore
targets:
  Kart:
    type: application
    platform: iOS
    sources:
      - path: Kart
      - path: ../data/store.json
        buildPhase: resources
    dependencies:
      - package: KartCore
        product: KartCore
      - package: KartCore
        product: KartSupabase
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: Kart/Info.plist
      properties:
        KartSupabaseURL: $(SUPABASE_URL)
        KartSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        KartCartID: $(CART_ID)
        NSMicrophoneUsageDescription: Kart listens so you can shop hands-free. The mic stays off until you tap Start.
        NSLocalNetworkUsageDescription: Kart talks to the store's computer on this Wi-Fi to keep your cart in sync.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - KartUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kart.app$(KART_BUNDLE_SUFFIX)   # com.kart.app is taken on Apple's side for devices
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kart
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  KartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KartUITests
    dependencies:
      - target: Kart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kart.app.uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
